services:
  - type: web
    name: schnell-asset-reports-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head && python app/database/cli_seed.py
    startCommand: gunicorn app.main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /api/health
    disk:
      name: schnell-excel-storage
      mountPath: /var/data/schnell_storage
      sizeGB: 10
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: schnell-asset-reports-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: STORAGE_ROOT
        value: /var/data/schnell_storage
      - key: TEMP_PROCESSING_DIR
        value: /var/data/schnell_storage/_tmp
      - key: MAX_UPLOAD_SIZE_MB
        value: "25"
      - key: CORS_ORIGINS
        value: https://schnell-asset-reports.onrender.com
      - key: SEED_DEFAULT_DATA
        value: "true"
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false

  - type: web
    name: schnell-asset-reports
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://schnell-asset-reports-api.onrender.com/api

databases:
  - name: schnell-asset-reports-db
    plan: starter
    databaseName: schnell_reports
    user: schnell_app

